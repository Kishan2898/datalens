services:
  - type: web
    name: datalens-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm run start
    plan: free
    envVars:
      - key: PORT
        value: 4000
      - key: CLIENT_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DEMO_MODE
        value: true
      - key: JWT_SECRET
        sync: false
